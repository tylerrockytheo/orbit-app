<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Orbit · For you</title><style>:root{color-scheme:light dark;font-family:system-ui,-apple-system,Arial;--bg:#f0f2f5;--card:#fff;--fg:#1c1e21;--muted:#65676b;--border:#dddfe2;--accent:#1877f2}@media(prefers-color-scheme:dark){:root{--bg:#18191a;--card:#242526;--fg:#e4e6eb;--muted:#b0b3b8;--border:#3e4042;--accent:#67a8ff}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}header{height:55px;background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:3;border-bottom:1px solid var(--border)}.logo{font-weight:800;font-size:27px;letter-spacing:-1px;color:var(--accent)}main{max-width:620px;margin:auto;padding-bottom:90px}.intro{background:var(--card);padding:15px 16px;font-size:19px;font-weight:700}.post{background:var(--card);margin:9px 0 12px}.posthead{display:flex;align-items:center;gap:10px;padding:13px 16px}.avatar{width:38px;height:38px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:18px}.small{font-size:12px;color:var(--muted)}.post img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.post h2{font-size:18px;margin:0 0 8px}.post .body{padding:2px 16px 14px}.post p{font-size:14px;color:var(--muted);line-height:1.45;margin:0}.actions{display:flex;border-top:1px solid var(--border);justify-content:space-around;padding:5px}button{cursor:pointer;border:0;background:transparent;color:var(--muted);font:inherit;padding:10px}button:focus-visible{outline:2px solid var(--accent)}.actions button{font-size:14px;font-weight:600}.source{display:inline-block;margin:11px 0 0;color:var(--accent);font-size:13px;text-decoration:none}.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom);z-index:4}.nav button{flex:1;display:grid;gap:2px;justify-items:center;font-size:11px;padding:8px 2px}.nav button span{font-size:22px}.nav button.active{color:var(--accent)}.panel{background:var(--card);margin:10px 0;padding:20px}.panel h2{margin-top:0}.panel textarea{width:100%;height:130px;padding:12px;background:var(--bg);border:1px solid var(--border);color:var(--fg);font:inherit}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--border);border-radius:22px;padding:9px 13px}.chip.on{background:var(--accent);color:white}.sheet{position:fixed;inset:0;background:var(--bg);z-index:8;overflow:auto}.sheetheader{background:var(--card);padding:10px 16px;display:flex;justify-content:space-between;align-items:center}.hide{display:none}.hint{padding:12px;background:var(--bg);border-radius:9px;color:var(--muted);font-size:13px}a{color:var(--accent)}</style></head><body><header><span class="logo">orbit.</span><span>⌕ &nbsp; ◯</span></header><main id="main"></main><nav class="nav" id="nav"></nav><section class="sheet hide" id="sheet"></section><script>
const posts=[{id:"db",topic:"Anime",icon:"✦",title:"Your Dragon Ball universe",description:"Explore official series announcements, trailers and fan discoveries. Show updates take priority over game news.",image:"https://images.unsplash.com/photo-1578632767115-351597cf2477?w=1000",source:"https://en.dragon-ball-official.com/",sourceName:"Dragon Ball official site"},{id:"robot",topic:"Technology",icon:"◇",title:"Robotics beyond the hype",description:"Research demonstrations, real capabilities and practical developments in humanoid robots.",image:"https://images.unsplash.com/photo-1485827404703-89b55fcc595e?w=1000",source:"https://arxiv.org/search/?query=robotics&searchtype=all",sourceName:"Robotics research search"},{id:"music",topic:"Music",icon:"♫",title:"Behind the music",description:"Production breakdowns, studio ideas and emerging artists worth discovering.",image:"https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=1000",source:"https://www.youtube.com/results?search_query=music+production+breakdown",sourceName:"Explore videos"},{id:"games",topic:"Gaming",icon:"▣",title:"Indie games worth watching",description:"Creative mechanics, development diaries and unusual game worlds.",image:"https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1000",source:"https://www.youtube.com/results?search_query=indie+game+devlog",sourceName:"Explore devlogs"},{id:"travel",topic:"Travel",icon:"✈",title:"Find your next adventure",description:"Destinations, unusual experiences and travel inspiration.",image:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1000",source:"https://www.australia.com/",sourceName:"Explore destinations"}];
const storage=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}};let saved=new Set(storage("orbit_saved",[])),muted=new Set(storage("orbit_muted",[])),interests=storage("orbit_interests",["Anime","Technology","Music","Gaming","Travel"]),tab="Home";const persist=()=>{localStorage.setItem("orbit_saved",JSON.stringify([...saved]));localStorage.setItem("orbit_muted",JSON.stringify([...muted]));localStorage.setItem("orbit_interests",JSON.stringify(interests))};const get=id=>posts.find(p=>p.id===id);
function card(p){return '<article class="post"><div class="posthead"><div class="avatar">'+p.icon+'</div><div><strong>'+p.topic+'</strong><div class="small">Selected for you · Sample post</div></div></div><div class="body"><h2>'+p.title+'</h2><p>'+p.description+'</p></div><img loading="lazy" src="'+p.image+'" alt=""><div class="body"><a class="source" target="_blank" rel="noopener noreferrer" href="'+p.source+'">Source: '+p.sourceName+' ↗</a></div><div class="actions"><button data-action="save" data-id="'+p.id+'">'+(saved.has(p.id)?"▣ Saved":"▢ Save")+'</button><button data-action="share" data-id="'+p.id+'">↗ Share</button><button data-action="more" data-id="'+p.id+'">⋯ Options</button></div></article>'}
function render(){const tabs=["Home","World","Explore","Saved","You"],icons=["⌂","◎","◇","▢","☻"];document.getElementById("nav").innerHTML=tabs.map((t,i)=>'<button data-tab="'+t+'" class="'+(tab===t?"active":"")+'"><span>'+icons[i]+'</span>'+t+'</button>').join("");let visible=posts.filter(p=>!muted.has(p.topic));if(tab==="Saved")visible=posts.filter(p=>saved.has(p.id));if(tab==="World")visible=visible.filter(p=>p.topic==="Technology");if(tab==="Explore")visible=visible.slice().reverse();if(tab==="Home")visible.sort((a,b)=>Number(interests.includes(b.topic))-Number(interests.includes(a.topic)));const heading={Home:"For you",World:"World · Example format",Explore:"Discover",Saved:"Saved posts",You:"Your interests"}[tab];document.getElementById("main").innerHTML='<div class="intro">'+heading+'</div>'+(tab==="You"?profile():visible.length?visible.map(card).join(""):'<div class="panel">Nothing here yet. Explore some posts and save what you like.</div>')}
function profile(){return '<div class="panel"><h2>Make it yours</h2><p class="small">Select interests. Your choices stay on this device for now.</p><div class="chips">'+["Anime","Technology","Music","Gaming","Travel"].map(t=>'<button class="chip '+(interests.includes(t)?"on":"")+'" data-interest="'+t+'">'+t+'</button>').join("")+'</div><h3>Bring your AI profile</h3><p class="small">Paste an AI-generated interest summary to review later. This demo does not send or save pasted conversations.</p><textarea placeholder="Paste your interest profile..."></textarea><p class="hint">Profile import processing is not connected yet. Your private chat history is not collected.</p></div>'}
function sheet(html){document.getElementById("sheet").classList.remove("hide");document.getElementById("sheet").innerHTML='<div class="sheetheader"><strong>Orbit</strong><button data-action="close">✕ Close</button></div>'+html}function close(){document.getElementById("sheet").classList.add("hide");if(location.hash.startsWith("#post="))history.replaceState(null,"",location.pathname)}
function openPost(id){const p=get(id);if(!p)return;sheet(card(p)+'<div class="panel"><h3>Shared post</h3><p class="small">Viewing a shared post does not affect your recommendations.</p><p class="hint">Would you like to see more of this topic?</p><div class="chips"><button data-action="vote" data-choice="yes" data-id="'+id+'">Yes</button><button data-action="vote" data-choice="no" data-id="'+id+'">No</button><button data-action="vote" data-choice="maybe" data-id="'+id+'">Maybe</button></div><p class="small">New here? Orbit is a private personalised feed. App download is coming later; this post remains free to view.</p></div>')}
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo(0,0);return}if(b.dataset.interest){const t=b.dataset.interest;interests=interests.includes(t)?interests.filter(x=>x!==t):[...interests,t];persist();render();return}const id=b.dataset.id,action=b.dataset.action;if(action==="close"){close();return}if(action==="save"){saved.has(id)?saved.delete(id):saved.add(id);persist();render();if(!document.getElementById("sheet").classList.contains("hide"))openPost(id)}if(action==="more"){const p=get(id);sheet('<div class="panel"><h2>'+p.topic+'</h2><p>Control what you see in your feed.</p><button data-action="mute" data-id="'+id+'">Show less of '+p.topic+'</button><button data-action="close">Cancel</button></div>')}if(action==="mute"){muted.add(get(id).topic);persist();close();render()}if(action==="share"){const url=location.origin+location.pathname+"#post="+id;try{if(navigator.share)await navigator.share({title:get(id).title,url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);alert("Post link copied")}else prompt("Copy this link",url)}catch{}}if(action==="vote"){if(b.dataset.choice==="yes"){const t=get(id).topic;if(!interests.includes(t))interests.push(t);persist()}sheet('<div class="panel"><h2>Thanks!</h2><p>'+(b.dataset.choice==="yes"?"This topic has been added to your interests.":"Your feed stays unchanged.")+'</p><button data-action="close">Done</button></div>')}});
render();if(location.hash.startsWith("#post="))openPost(decodeURIComponent(location.hash.slice(6)));window.addEventListener("hashchange",()=>{if(location.hash.startsWith("#post="))openPost(decodeURIComponent(location.hash.slice(6)))});
</script><script src="live.js?v=2" defer></script></body></html>
