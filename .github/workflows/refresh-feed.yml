name: Refresh Orbit feed
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_feed.py'
      - 'tests/test_feed.py'
      - '.github/workflows/refresh-feed.yml'
permissions:
  contents: write
concurrency:
  group: orbit-feed-refresh
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parser and fallback
        run: python -m unittest discover -s tests -v
      - name: Retrieve public articles and official video feeds
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/build_feed.py
      - name: Commit refreshed feed JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Orbit public feed'
            git push
          fi
