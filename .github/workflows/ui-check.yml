name: Orbit interface smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'discovery.js'
      - 'interest-engine.js'
      - 'tests/interest-engine.mjs'
      - 'beta.js'
      - 'tests/beta-smoke.mjs'
      - 'tests/discovery-smoke.mjs'
      - 'tests/feed-mix.mjs'
      - 'app.js'
      - 'account.js'
      - 'orbit-config.js'
      - 'tests/account-smoke.mjs'
      - 'tests/firebase-config-smoke.mjs'
      - 'styles.css'
      - 'index.html'
      - 'tests/reels-smoke.mjs'
      - 'tests/reel-motion.mjs'
      - 'tests/providers-smoke.mjs'
      - 'tests/seek-smoke.mjs'
      - 'tests/feed-autoplay.mjs'
      - 'tests/feed-player-state.mjs'
      - 'tests/freshness-smoke.mjs'
      - '.github/workflows/ui-check.yml'
  pull_request:
    paths:
      - 'discovery.js'
      - 'interest-engine.js'
      - 'tests/interest-engine.mjs'
      - 'beta.js'
      - 'tests/beta-smoke.mjs'
      - 'tests/discovery-smoke.mjs'
      - 'tests/feed-mix.mjs'
      - 'app.js'
      - 'account.js'
      - 'orbit-config.js'
      - 'tests/account-smoke.mjs'
      - 'tests/firebase-config-smoke.mjs'
      - 'styles.css'
      - 'index.html'
      - 'tests/reels-smoke.mjs'
      - 'tests/reel-motion.mjs'
      - 'tests/providers-smoke.mjs'
      - 'tests/seek-smoke.mjs'
      - 'tests/feed-autoplay.mjs'
      - 'tests/feed-player-state.mjs'
      - 'tests/freshness-smoke.mjs'
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: node --check app.js && node --check discovery.js && node --check interest-engine.js && node --check beta.js && node --check account.js && node --check orbit-config.js
      - name: Verify tester entry and private feedback sharing
        run: node tests/beta-smoke.mjs
      - name: Verify mixed Home feed and website summaries
        run: node tests/feed-mix.mjs
      - name: Verify public article discovery
        run: node tests/interest-engine.mjs
      - name: Verify private onboarding and discovery
        run: node tests/discovery-smoke.mjs
      - name: Verify guest mode and account safety
        run: node tests/account-smoke.mjs
      - name: Verify connected public Firebase configuration
        run: node tests/firebase-config-smoke.mjs
      - name: Verify Reels interactions
        run: node tests/reels-smoke.mjs
      - name: Verify fast swipes and Reel playback continuity
        run: node tests/reel-motion.mjs
      - name: Verify cross-platform providers
        run: node tests/providers-smoke.mjs
      - name: Verify seeking and native ad controls
        run: node tests/seek-smoke.mjs
      - name: Verify scrolling feed video autoplay
        run: node tests/feed-autoplay.mjs
      - name: Verify buffering and resumed video state
        run: node tests/feed-player-state.mjs
      - name: Verify freshness and in-place Reels refresh
        run: node tests/freshness-smoke.mjs
