name: Orbit interface smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'styles.css'
      - 'index.html'
      - 'tests/reels-smoke.mjs'
      - 'tests/providers-smoke.mjs'
      - '.github/workflows/ui-check.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'styles.css'
      - 'index.html'
      - 'tests/reels-smoke.mjs'
      - 'tests/providers-smoke.mjs'
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: node --check app.js
      - name: Verify Reels interactions
        run: node tests/reels-smoke.mjs
      - name: Verify cross-platform providers
        run: node tests/providers-smoke.mjs
